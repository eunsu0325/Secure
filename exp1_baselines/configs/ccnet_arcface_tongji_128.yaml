# CCNet (Yang et al. 2023, IEEE TIFS, "Comprehensive Competition Mechanism in
# Palmprint Recognition") + ArcFace, scratch training on Tongji ROI 128x128.
#
# Plan §V17.8 multi-backbone fairness lock + §V16.3 deviation table:
#
# Architecture (preserved verbatim from upstream Zi-YuanYang/CCNet):
#   - 3 parallel branches with learnable Gabor kernel sizes 7/17/35 + Comp Block
#   - SE layer (reduction=1 = identity bottleneck), no BatchNorm
#   - Comp weights w_c=0.8, w_s=0.1
#
# Architecturally-required input (V17.2):
#   - Resolution 128x128 (Linear(13152, 4096) hardcoded for 128 input;
#     112 input produces 9840 != 13152 and the forward errors)
#   - Channels: 1 (grayscale, CCNet author input)
#
# Inference embedding (V17.8 D2 — matches upstream getFeatureCode):
#   - 2048-D L2-normalized fc1 output (NOT the 6144-D training-time fe)
#   - The upstream test loop uses net.getFeatureCode(data) for matching;
#     our wrapper.forward(x) returns the same 2048-D embedding
#
# Training-recipe deviations from CCNet upstream (V17.8 D1, D5):
#   Upstream (verified from train.py):
#     Adam lr=0.001 (no wd) | StepLR(500, 0.8) | batch=1024 | epoch=3000
#     Loss = 0.8 * CE(ArcMarginProduct(s=30, m=0.5)) + 0.2 * SupCon(6144D fe, τ=0.07)
#   Ours (recipe parity with MFN-ArcFace):
#     SGD lr=0.01 mom=0.9 wd=1e-4 | cosine + 1ep warmup | batch=128 (PK=32x4)
#     epoch=50 (L1 first; L2 200ep fallback per V17.10 TPIR gate)
#     Loss = ArcFaceHead(s=48, m=0.5) cross-entropy only (NO SupCon)
#   Iteration ratio: ~8x fewer than upstream (~2,250 vs ~18,000)
#
# Author-pretrained ban (V17.8 + V16.5):
#   - No author-pretrained Tongji checkpoint loaded
#   - Trained from scratch on our train_backbone split

model:
  name: ccnet
  architecture: ccnet
  embedding_dim: 2048         # V17.8 lock: matches upstream getFeatureCode
  backbone_kwargs:
    weight: 0.8               # CCNet author's competitive weight (released config)
    use_dropout: false        # V17.8 D4: matches upstream getFeatureCode (no dropout in inference path)

dataset:
  name: tongji_roi_baselines
  manifest_dir: experiments/generated/tongji_full
  image_size: 128             # CCNet architecture-native; cannot be 112
  channels: 1                 # grayscale (CCNet author input)
  normalize_mean: [0.5]
  normalize_std: [0.5]

arcface:
  margin: 0.5                 # MFN-ArcFace parity
  scale: 48.0                 # MFN-ArcFace parity (NOT CCNet original s=30; documented in paper)
  eps: 1.0e-7

train:
  epochs: 50                  # MFN parity
  batch_size: 128             # MFN parity
  P: 32                       # identities per batch
  K: 4                        # samples per identity per batch
  num_workers: 0              # V17 mem-pressure fix: single-process data loading
                              # (multi-worker forking each spawned a copy of the
                              # CCNet model in MPS unified memory, triggering
                              # heavy swap; ep 2 took 3 hours under swap pressure.
                              # Single-process loading keeps MPS memory headroom.)
  optimizer: sgd
  lr: 0.01                    # MFN parity
  momentum: 0.9
  weight_decay: 1.0e-4
  warmup_epochs: 1
  scheduler: cosine
  amp: false
  seed: 42
  log_interval: 10

output:
  checkpoint_path: experiments/generated/tongji_full/ccnet_arcface_tongji_scratch_128.pt
  log_dir: experiments/generated/tongji_full/ccnet_logs
