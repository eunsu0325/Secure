# IR-ResNet50 + ArcFace, scratch training on Tongji ROI 112x112
# V19 Path 3b: stronger generic CNN baseline (alongside MFN + CCM-on-MFN).
#
# Recipe parity with MFN (V19.2 unified Family-A recipe):
#   SGD lr=0.01 mom=0.9 wd=1e-4, batch=128 (P=32, K=4), 50 epochs cosine + 1ep warmup,
#   ArcFace m=0.5 s=48, 112×112 3-channel RGB-replicated grayscale input,
#   embedding_dim=512.
#
# V19 deviation note: IR-ResNet50 is documented by UAA ICCV 2025 as a SOTA
# palmprint baseline backbone, where UAA's recipe is SGD lr=0.1 batch=256 30ep
# cosine WD. We use our V19.2 unified recipe (lr=0.01, batch=128 PK, 50ep cosine
# LR) for within-paper recipe parity across the three V19 backbones. Absolute
# TPIR numbers may differ from UAA's; protocol-gap shape (Theorem 1a) is not
# expected to depend on these recipe specifics.
#
# V17.12 / V17 MPS mem-pressure lesson: num_workers=0 (multi-process fork
# multiplies MPS model copies; see PHASE5_SESSION_LOG.md §6.1 lesson 1).

model:
  name: ir50
  architecture: iresnet50
  embedding_dim: 512

dataset:
  name: tongji_roi_baselines
  manifest_dir: experiments/generated/tongji_full
  image_size: 112
  channels: 3
  normalize_mean: [0.5, 0.5, 0.5]
  normalize_std: [0.5, 0.5, 0.5]

arcface:
  margin: 0.5
  scale: 48.0
  eps: 1.0e-7

train:
  epochs: 50
  batch_size: 128
  P: 32                       # identities per batch
  K: 4                        # samples per identity per batch
  num_workers: 0              # V17 MPS mem-pressure fix
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 1.0e-4
  warmup_epochs: 1
  scheduler: cosine
  amp: false
  seed: 42
  log_interval: 10

output:
  checkpoint_path: experiments/generated/tongji_full/ir50_arcface_tongji_scratch_112.pt
  log_dir: experiments/generated/tongji_full/ir50_logs
