# COCONUT Configuration 

Dataset:
  # 등록 대상 사용자 파일 — 내부에서 90% train/NCM + 10% probe로 자동 분리됨
  enroll_file: /content/drive/MyDrive/데이터셋/BJTU_PalmV2(ROI)/train_left.txt

  # 독립적인 per-user 평가용 probe 파일 — BWT/forgetting 측정 전용 (enroll_file과 다른 파일)
  eval_probe_file: /content/drive/MyDrive/데이터셋/BJTU_PalmV2(ROI)/test_left.txt

  height: 128
  width: 128
  channels: 1
  augmentation: true

  # 크로스도메인 FPIR_xdom 평가 전용 파일 — 학습에 사용하지 않음 (예: IITD 데이터셋)
  xdomain_file: /content/drive/MyDrive/데이터셋/train_IITD.txt
  num_xdomain_classes: 148

  # τ calibration용 비등록 사용자 데이터 — enroll_file 미등록 ID 앞 50%로 구성 권장
  unknown_dev_file: /content/drive/MyDrive/데이터셋/BJTU_PalmV2(ROI)/unknown_dev_file.txt
  # FPIR_in 최종 평가용 비등록 사용자 데이터 — enroll_file 미등록 ID 뒤 50%로 구성 권장
  unknown_test_file: /content/drive/MyDrive/데이터셋/BJTU_PalmV2(ROI)/unknown_test_file.txt
Model:
  architecture: ccnet
  competition_weight: 0.8
  use_pretrained: true
  pretrained_path: /content/drive/MyDrive/tongji.pth
Training:
  experience_batch_size: 16
  memory_batch_size: 160  
  num_experiences: 100
  memory_size: 160
  min_samples_per_class: 9

  epochs_per_experience: 3
  iterations_per_epoch: 10
  num_workers: 8
  learning_rate: 0.0001
  scheduler_step_size: 40           # 50→40 (LR decay를 조금 더 일찍, 2회 decay 가능)
  scheduler_gamma: 0.5              # 0.8→0.5 (더 확실한 LR 감소: 0.0001→0.00005→0.000025)
  test_interval: 1  # Evaluation and calibration frequency
  checkpoint_path: /content/drive/MyDrive/coconut_update_13
  results_path: /content/drive/MyDrive/coconut_update_13
  gpu_ids: "0"
  ncm_momentum: 0.8
  seed: 42

  # Logging
  verbose: false  # true: 전체 출력, false: compact 출력 (논문 지표 중심)

  # ProxyAnchorLoss settings
  use_proxy_anchor: true
  proxy_margin: 0.1          # 0.15→0.1 (논문 default, alpha=32와 균형)
  proxy_alpha: 32            # 16→32 (논문 default, class separation 강화)
  proxy_lr_ratio: 50         # 100→50 (proxy 진동 방지, 논문 권장 10~100 범위 내)
  proxy_lambda: 1.0          # 단독 손실(=ProxyAnchor only) 가중치. 0.5는 SupCon 동시학습 잔재라 1.0으로 정정.

  # QAR (Quality-Aware Replay) — tail user 선별 재학습
  # 배치 구성: current(16) + memory(160, balanced) + rehab(tail only, 추가)
  use_qar: true
  rehab_margin: 0.05        # tau_cos + margin 이하를 tail로 판정 (0.0=임계치 정확히, 0.05=여유)
  rehab_samples_per_user: 4 # tail user당 추가 replay 샘플 수 (memory_size/100 ≈ 10, 40% 활용)
  qar_warmup_users: 10      # QAR 활성화 최소 등록 사용자 수 (= openset.warmup_users와 정합)

  # Loss-head ablation 대조군 (ProxyAnchor vs softmax) — 'proxy'=현행 byte-identical.
  # cosine_softmax/vanilla_softmax로 바꾸면 ProxyAnchor를 끄고 softmax CE로 학습
  # (같은 백본·데이터·NCM eval, 손실만 교체 = "ProxyAnchor가 망각을 막는다" 귀속 실험).
  loss_head: 'proxy'         # 'proxy' | 'cosine_softmax' | 'vanilla_softmax'
  softmax_lr_ratio: 50.0     # softmax head LR = learning_rate × 이 값 (proxy proxy_lr_ratio와 동등)
  softmax_scale: 32.0        # cosine_softmax logit scale s — proxy_alpha(32)와 동일(matched). {16,32,64} 튜닝 가능
  softmax_lambda: 1.0        # softmax 손실 weight = proxy_lambda(1.0)와 동일(matched, 단독손실 자연값)

  # MRS (Memory-risk Replay Scheduling: ⓐ SSL + ⓑ cohort 간격 + ⓒ 위험 override)
  # 전부 default OFF = 기존 동작과 byte-identical. Phase 3에서 켜서 균등/QAR과 비교.
  use_mrs: false            # ⓑ+ⓒ replay 스케줄링 활성화
  mrs_recall_interval: 2    # ⓑ: 각 사용자를 R experience마다 recall (1=off=균등; 켤 땐 2~3)
  mrs_warmup_users: 10      # ⓑ: 등록 < 이 수면 균등
  mrs_override_cap: 0       # ⓒ: 한 번에 override할 최대 사용자 수 (0=무제한)
  w_ssl: 0.0                # ⓐ: SSL consistency 가중 (0=off; 켤 땐 0.3~0.5)

  # AAVB: 공정한 replay 예산 배분 (plan §L B3/D8). false=legacy(byte-identical).
  # ⚠️ AAVB 실험(Phase 0c~4)은 baseline 포함 전 arm에서 true로 둘 것.
  fair_remainder: false

  # AAVB (Activation-Adaptive View-Batch Replay) — plan §L. 전부 OFF=byte-identical.
  # 상호배타: use_qar/use_mrs/use_aavb 중 최대 1개만 true.
  use_aavb: false           # 마스터 (C1 view-batch). Phase 2 A2/A4에서 true.
  view_batch_V: 3           # 뷰 수 V (1 weak + V-1 strong). VBM x3~4 검증치.
  aavb_ssl: false           # C2 one-to-many KL (Phase 3)
  aavb_adaptive: false      # C3 activation 스케줄링 (Phase 4)
  aavb_peak_window: 10      # C3 decline window-max W (D15)
  aavb_samples_per_user_target: 5  # C3 K_target = memory_distinct // 이 값 (D5)

# Open-set recognition settings
Openset:
  enabled: true

  threshold_mode: 'far'
  target_far: 0.01            # FAR target 1%

  # Initial values and warmup
  warmup_users: 10           # Warmup period
  initial_tau: 0.3           # Initial threshold

  # Data split
  dev_ratio: 0.1             # Dev set ratio (0.4→0.1: 학습 데이터 더 확보)

  # Logging
  verbose_calibration: true  # Verbose output

  # Rejection gate mode: 'top1_only' | 'top1_margin'
  rejection_gate: 'top1_only'     # top-1 score ≥ τ 단일 게이트 (+ S-norm)
  use_snorm: true                 # per-class Z-score normalization (crowding 보정)
