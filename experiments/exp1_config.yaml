# Experiment 1: Protocol Comparison
# "같은 모델, 세 가지 평가 프로토콜 → 서로 다른 결론"

experiment:
  name: exp1_protocol_comparison
  seed: 42
  output_dir: results/exp1_protocol_comparison

dataset:
  txt_file: data/bjtu_exp1.txt
  # txt 파일에 절대경로(심링크)를 쓰면 base_path는 빈 문자열로 둠
  base_path: ""
  height: 128
  width: 128
  channels: 1

identity_split:
  n_base: 30
  n_future: 130
  n_external: 130

sample_split:
  n_enroll: 2
  n_dev: 1
  # n_test는 자동: (해당 ID 전체 샘플 수 - n_enroll - n_dev)
  # 필터 기준: 각 ID의 샘플 수가 최소 (n_enroll + n_dev + n_test_min) 이상이어야 usable
  n_test_min: 2

model:
  architecture: ccnet
  competition_weight: 0.8
  # 로컬 pretrained 경로 — 실행 전 반드시 확인
  pretrained_path: checkpoints/tongji.pth

scoring:
  mode: cosine
  # threshold: external unknown dev의 99th percentile (FPIR=1%)
  target_fpir: 0.01

protocol_c:
  future_batch_size: 10  # step당 추가할 Future ID 수 (130/10 = 13 step)

# Static open-set size sweep용 gallery size list (B-s1/s2/s3/sF).
# - 첫 값은 n_base 와 동일 (baseline)
# - 마지막 값은 n_base + n_future 와 동일 (size-matched sanity: B-sF ≈ C-recalib-final)
# - 각 s에 대해 (s - n_base) % future_batch_size == 0 이어야 C_step_k 와 정확히 매핑
# BJTU: [30, 60, 100, 160] → C_step {0, 3, 7, 13}
# IITD: [60, 120, 180, 260] → C_step {0, 3, 6, 10}
static_gallery_sizes: [30, 60, 100, 160]
